name: Archive SCI bundles
on:
  push:
    branches: [sciscape-inbox]
    paths: ['inbox/*.zip']
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sci-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: sciscape-inbox
          path: queue
          persist-credentials: false
      - name: Find an unarchived bundle
        id: inbox
        run: |
          set -euo pipefail
          shopt -s nullglob
          for bundle in queue/inbox/*.zip; do
            digest=${bundle##*/}
            digest=${digest%.zip}
            if [[ ! -f sci/publications.txt ]] || ! grep -Fxq "$digest" sci/publications.txt; then
              echo 'pending=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        if: steps.inbox.outputs.pending == 'true'
        with:
          python-version: '3.13'
      - name: Install the pinned SCI client
        if: steps.inbox.outputs.pending == 'true'
        run: pip install 'git+https://github.com/azaho/sci@ee1b5d93bea9fa701db10b068e79100bcfe17a8e'
      - name: Verify and archive signed bundles
        if: steps.inbox.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for bundle in queue/inbox/*.zip; do
            sci verify "$bundle" --public-key public-signing.pem
          done
          sci publish queue/inbox --to "https://github.com/$GITHUB_REPOSITORY" --json
