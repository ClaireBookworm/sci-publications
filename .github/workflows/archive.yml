name: Archive SCI bundles
on:
  push:
    branches: [sciscape-inbox]
    paths: ['inbox/*.zip']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sci-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.13'
      - name: Install the pinned SCI client
        run: pip install 'git+https://github.com/azaho/sci@ee1b5d93bea9fa701db10b068e79100bcfe17a8e'
      - name: Verify and archive signed bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sci --version
          gh api "repos/$GITHUB_REPOSITORY" --jq .visibility
          shopt -s nullglob
          bundles=(inbox/*.zip)
          if (( ${#bundles[@]} == 0 )); then
            echo 'Archive client and repository access are ready.'
            exit 0
          fi
          for bundle in "${bundles[@]}"; do
            sci verify "$bundle" --public-key public-signing.pem
          done
          sci publish inbox --to "https://github.com/$GITHUB_REPOSITORY" --json
